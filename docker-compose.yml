services:
  # Service base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: zombieland-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zombieland
      # Fourni par le fichier .env présent sur le VPS (voir DEPLOY.md). Échoue si absent.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      POSTGRES_DB: zombieland
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Port standard de PostgreSQL
    networks:
      - zombieland-network
      
  # Service backend (API) — image construite et poussée sur GHCR par la CI
  backend:
    image: ghcr.io/creach-t/zombieland-back:latest
    container_name: zombieland-backend
    restart: unless-stopped
    depends_on:
      - postgres
    # Secrets fournis par le fichier .env sur le VPS (jamais committés). Voir DEPLOY.md.
    environment:
      - PORT=3666
      - PG_URL=postgres://zombieland:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}@postgres:5432/zombieland
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET requis dans .env}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET requis dans .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@zombieland.fr}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MAIL=${MAIL:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - FRONT_URL=https://zombieland.creachtheo.fr  # restreint aussi les origines CORS
      - BACK_URL=https://api-zombieland.creachtheo.fr/
      - VITE_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${VITE_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - VITE_NEXT_PUBLIC_STRIPE_PRICE_ID=${VITE_NEXT_PUBLIC_STRIPE_PRICE_ID:-}
    expose:
      - "3666"  # Exposé au réseau interne uniquement
    networks:
      - zombieland-network
      - traefik-public
    command: >
      sh -c "node src/migrations/checkDb.js || npm run db:reset; PORT=3666 npm run dev"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zombieland-backend.rule=Host(`api-zombieland.creachtheo.fr`)"
      - "traefik.http.routers.zombieland-backend.entrypoints=websecure"
      - "traefik.http.routers.zombieland-backend.tls=true"
      - "traefik.http.routers.zombieland-backend.tls.certresolver=myresolver"
      - "traefik.http.services.zombieland-backend.loadbalancer.server.port=3666"
      
  # Service frontend — image construite et poussée sur GHCR par la CI
  frontend:
    image: ghcr.io/creach-t/zombieland-front:latest
    container_name: zombieland-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=https://api-zombieland.creachtheo.fr
      - VITE_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${VITE_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - VITE_NEXT_PUBLIC_STRIPE_PRICE_ID=${VITE_NEXT_PUBLIC_STRIPE_PRICE_ID:-}
    expose:
      - "5173"  # Exposé au réseau interne uniquement
    networks:
      - zombieland-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zombieland-frontend.rule=Host(`zombieland.creachtheo.fr`)"
      - "traefik.http.routers.zombieland-frontend.entrypoints=websecure"
      - "traefik.http.routers.zombieland-frontend.tls=true"
      - "traefik.http.routers.zombieland-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.zombieland-frontend.loadbalancer.server.port=5173"

networks:
  zombieland-network:
    driver: bridge
  traefik-public:
    external: true  # Utilise le réseau Traefik existant
    
volumes:
  postgres-data:

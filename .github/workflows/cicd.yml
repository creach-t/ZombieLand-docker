name: CI/CD

# Build des images front & back -> push sur GHCR -> déploiement sur le VPS
# via SSH tunnelisé par Cloudflare Access (le VPS n'expose pas de port SSH public,
# on l'atteint à travers le tunnel Cloudflare).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_BACK: ghcr.io/creach-t/zombieland-back
  IMAGE_FRONT: ghcr.io/creach-t/zombieland-front
  # cloudflared est ÉPINGLÉ : la 2026.6.0 casse l'auth par service token
  # (cf. https://github.com/cloudflare/cloudflared/issues/1673).
  CLOUDFLARED_VERSION: "2026.5.1"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Les sources front/back vivent dans des repos séparés : on les checkout ici.
      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          repository: creach-t/ZombieLand-back
          path: ZombieLand-back
          token: ${{ secrets.GHCR_PAT }}

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: creach-t/ZombieLand-front
          path: ZombieLand-front
          token: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ZombieLand-back
          push: true
          tags: |
            ${{ env.IMAGE_BACK }}:latest
            ${{ env.IMAGE_BACK }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ZombieLand-front
          push: true
          tags: |
            ${{ env.IMAGE_FRONT }}:latest
            ${{ env.IMAGE_FRONT }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (docker-compose.yml de ce repo)
        uses: actions/checkout@v4

      - name: Install cloudflared (pinned ${{ env.CLOUDFLARED_VERSION }})
        run: |
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over Cloudflare Access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host $SSH_HOSTNAME
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy docker-compose.yml to the VPS
        env:
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "$SSH_HOSTNAME" "mkdir -p '$VPS_DEPLOY_PATH'"
          scp docker-compose.yml "$SSH_HOSTNAME:$VPS_DEPLOY_PATH/docker-compose.yml"

      - name: Pull images & restart stack
        env:
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh "$SSH_HOSTNAME" GHCR_USER="$GHCR_USER" GHCR_PAT="$GHCR_PAT" VPS_DEPLOY_PATH="$VPS_DEPLOY_PATH" 'bash -s' <<'EOF'
          set -euo pipefail
          echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd "$VPS_DEPLOY_PATH"
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          EOF
